name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate Ira-Dolphin Study 02
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '''        <div class="big-quote">I don't want AI to be a line on my resume.<br><span class="accent-text">I want it to be something I can ship.</span></div>'''
          study = '''        <div class="case-label">CASE STUDY 02 · IRA-DOLPHIN · FROM MODEL TO REPRODUCIBLE EXPERIMENT</div>
        <div class="build-grid"><div class="product-story"><span class="live">● AI MODEL PROJECT</span><h3>Ira-Dolphin</h3><p>A hands-on LLM fine-tuning project exploring how an open model can be adapted, tested and documented as a reproducible AI engineering workflow.</p><div class="case-proof"><div><small>QUESTION</small><strong>How do I move beyond consuming LLM APIs and understand model adaptation firsthand?</strong></div><div><small>BUILD</small><strong>Fine-tune, evaluate and document the model workflow so the experiment can be reproduced.</strong></div><div><small>WHY IT MATTERS</small><strong>It expands my AI journey from product integration into the model layer itself.</strong></div></div><a class="case-link" href="/projects/ira-dolphin/">Explore Ira-Dolphin case study <span>↗</span></a><div class="chips"><span class="chip">LLM Fine-tuning</span><span class="chip">LoRA</span><span class="chip">Qwen</span><span class="chip">Unsloth</span><span class="chip">Hugging Face</span><span class="chip">Reproducible AI</span></div></div><div class="terminal"><b>STUDY 02</b><br><br><strong>learn</strong>&nbsp;&nbsp;&nbsp;&nbsp;the model layer<br><strong>adapt</strong>&nbsp;&nbsp;&nbsp;&nbsp;an open LLM<br><strong>fine-tune</strong>&nbsp;with LoRA<br><strong>evaluate</strong>&nbsp;&nbsp;the result<br><strong>document</strong>&nbsp;&nbsp;the workflow<br><strong>share</strong>&nbsp;&nbsp;&nbsp;&nbsp;for reproduction<br><br><b>AI journey:</b><br>API integration → model experimentation ✓</div></div>
'''
          if 'CASE STUDY 02 · IRA-DOLPHIN' not in s:
              if anchor not in s:
                  raise SystemExit('Homepage insertion point not found')
              s = s.replace(anchor, study + anchor, 1)
          s = s.replace('<div><b>1</b><span>AI product shipped</span></div>', '<div><b>2</b><span>AI projects built</span></div>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
